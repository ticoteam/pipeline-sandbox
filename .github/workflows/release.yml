name: release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Tag vN and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(git tag --list 'v*' | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -1)
          next="v$(( ${last:-0} + 1 ))"
          sha=$(git rev-parse HEAD)
          echo "Releasing $next at $sha"
          gh release create "$next" --target "$sha" --title "$next" --generate-notes
